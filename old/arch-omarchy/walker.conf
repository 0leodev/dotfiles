# LOCATION ~/.local/share/omarchy/default/hypr/apps/walker.conf

# Application-specific animation
layerrule = no_anim on, match:namespace walker

# Compositor blur (allows content behind the transparent background to be blurred)
layerrule = blur on, match:namespace walker
layerrule = xray on, match:namespace walker
layerrule = ignore_alpha 0.2, match:namespace walker
